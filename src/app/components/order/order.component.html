<app-modal
  [open]="isOpen" 
  (clickClose)="openModal($event)"
>
  <app-form 
    [form]="form" 
    [title]="title" 
    [message]="message" 
    [messageColor]="messageColor"
    [action]="action" 
    [dishesOptions]="dishOptions"
    [controls]="controls"
    (submit)="submit()"
  >
  </app-form>
</app-modal>

<app-modal
  [open]="isOpenDetails" 
  (clickClose)="closeDetailsModal()"
>
  <app-view-details
    [order] = "order"
    (confirmOrder)="confirmOrderById($event)"
    (cancelOrder)="cancelOrderById($event)"
    (prepareOrder)="prepareOrderById($event)"
    (completeOrder)="completeOrderById($event)"
    (deliverOrder)="deliverOrderById($event)"
  ></app-view-details>
</app-modal>

<app-table 
  [title]="'Pedidos'" 
  [data]="orders" 
  [columns]="columns" 
  (openModal)="openModal($event)" 
  (openDetailsModal)="openDetailsModal($event)"
  (idDelete)="deleteOrderById($event)" 
  (idUpdate)="updateById($event)"
  [showFilters]="true"
>
  <app-filters
  [types]="states"
  [label]="'Filtrar por tipo de estado'"
  (typeChange)="onStateFilter($event)"
  ></app-filters>
</app-table>
